name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Backend verify (tests + JaCoCo)
        working-directory: apps/dartchain-backend
        run: ./mvnw -q verify

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/dartchain-frontend/Dart/package-lock.json
      - name: Install, test, a11y contract
        working-directory: apps/dartchain-frontend/Dart
        run: |
          npm ci
          npm test -- --no-watch --coverage=false
          npm run verify:a11y
      - name: Production build
        working-directory: apps/dartchain-frontend/Dart
        run: npm run build
      - name: Cloudflare build smoke
        working-directory: apps/dartchain-frontend/Dart
        env:
          BACKEND_URL: https://dartchain-backend-1-0-0.onrender.com
        run: npm run build:cloudflare

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build backend Docker image
        run: docker build -t dartchain-backend:ci apps/dartchain-backend
      - name: Build frontend Docker image
        run: docker build -t dartchain-frontend:ci apps/dartchain-frontend/Dart
