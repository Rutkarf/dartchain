# Déploiement prod = Cloudflare Pages (build Git natif sur push main → Rutkarf/dartchain).
# Ce workflow ne sert qu'à un upload manuel via wrangler pages deploy.
name: Cloudflare Pages Deploy (manual)

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/dartchain-frontend/Dart/package-lock.json
      - name: Build frontend
        working-directory: apps/dartchain-frontend/Dart
        env:
          BACKEND_URL: ${{ vars.BACKEND_URL || 'https://dartchain-backend-1-0-0.onrender.com' }}
          SHOWCASE_ENABLED: ${{ vars.SHOWCASE_ENABLED || 'true' }}
        run: |
          npm ci
          npm run build:cloudflare
      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler pages deploy dist/browser --project-name=dartchain
