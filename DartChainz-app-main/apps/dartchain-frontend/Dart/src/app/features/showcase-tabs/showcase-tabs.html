<nav class="showcase-tabs" aria-label="Onglets showcase">
  @for (tab of tabs; track tab.id) {
    <button
      type="button"
      role="tab"
      class="showcase-tab"
      [attr.data-tab]="tab.id"
      [class.is-active]="isActive(tab.id)"
      [attr.aria-selected]="isActive(tab.id)"
      [attr.tabindex]="isActive(tab.id) ? '0' : '-1'"
      [attr.aria-controls]="'showcase-panel-' + tab.id"
      [attr.id]="'showcase-tab-' + tab.id"
      (click)="selectTab(tab.id)"
    >
      <span class="showcase-tab__label">{{ tab.label }}</span>
      @if (tab.id === 'dao' && unreadNewsCount() > 0) {
        <span class="showcase-tab__badge" [attr.aria-label]="unreadNewsCount() + ' non lues'">
          {{ unreadNewsCount() > 9 ? '9+' : unreadNewsCount() }}
        </span>
      }
    </button>
  }
</nav>
