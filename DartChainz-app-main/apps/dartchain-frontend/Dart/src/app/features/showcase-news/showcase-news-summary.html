<div
  class="showcase-news-bar__fill"
  role="status"
  aria-live="polite"
  aria-label="Résumé des actualités"
>
  <div class="showcase-news-main">
    <span class="showcase-news-main__rail" aria-hidden="true"></span>

    @if (hasUnread()) {
      <span class="unread-badge" [attr.aria-label]="unreadCount() + ' non lues'">
        {{ unreadCount() > 99 ? '99+' : unreadCount() }}
      </span>
    } @else {
      <span class="showcase-news-main__status" aria-hidden="true"></span>
    }

    <p class="showcase-news-preview">
      @if (previewHeadline()) {
        <span class="showcase-news-preview__text">{{ previewHeadline() }}</span>
      } @else if (loading()) {
        <span class="showcase-news-preview__text showcase-news-preview__text--muted">
          Chargement…
        </span>
      } @else {
        <span class="showcase-news-preview__text showcase-news-preview__text--muted">
          {{ liveActivity() || 'Aucune actualité' }}
        </span>
      }
    </p>
  </div>

  <div class="showcase-news-meta">
    @if (liveAgeLabel()) {
      <span class="showcase-news-meta__time">{{ liveAgeLabel() }}</span>
    }

    <button
      type="button"
      class="showcase-news-meta__refresh"
      (click)="onRefresh($event)"
      [attr.aria-busy]="loading()"
      aria-label="Actualiser les actualités"
    >
      <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
        <path d="M21 12a9 9 0 0 1-15.5 6.36" />
        <path d="M3 12a9 9 0 0 1 15.5-6.36" />
        <path d="M17 4v4h-4" />
        <path d="M7 20v-4h4" />
      </svg>
    </button>
  </div>
</div>
