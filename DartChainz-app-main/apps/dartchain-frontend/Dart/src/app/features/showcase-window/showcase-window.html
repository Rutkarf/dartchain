<section
  class="showcase-window"
  aria-label="Terminal showcase"
  [attr.data-active-tab]="activeTab"
>
  <div
    class="showcase-window__body"
    [id]="'showcase-panel-' + activeTab"
    role="tabpanel"
    [attr.aria-labelledby]="'showcase-tab-' + activeTab"
  >
    <app-showcase-terminal
      [mode]="activeTab"
      [expanded]="!collapsed"
      (selectBlock)="onSelectBlock($event)"
    />
  </div>
</section>
