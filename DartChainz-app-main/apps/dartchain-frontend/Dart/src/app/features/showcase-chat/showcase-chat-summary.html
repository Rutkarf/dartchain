<div
  class="showcase-chat-bar__fill"
  role="status"
  aria-live="polite"
  [attr.aria-label]="'Résumé du chat ' + roomLabel()"
>
  <div class="showcase-chat-main">
    <span class="showcase-chat-main__rail" aria-hidden="true"></span>
    <span class="showcase-chat-main__room">{{ roomLabel() }}</span>
    <span
      class="showcase-chat-main__status"
      [class.showcase-chat-main__status--online]="connected()"
      [class.showcase-chat-main__status--offline]="!connected()"
      [attr.aria-label]="statusLabel()"
      [attr.title]="statusLabel()"
    ></span>
    @if (hasUnread()) {
      <span class="unread-badge" [attr.aria-label]="unreadCount() + ' non lus'">
        {{ unreadCount() > 99 ? '99+' : unreadCount() }}
      </span>
    }
  </div>

  <p class="showcase-chat-preview">
    @if (previewHeadline()) {
      <span class="showcase-chat-preview__text">{{ previewHeadline() }}</span>
    } @else {
      <span class="showcase-chat-preview__text showcase-chat-preview__text--muted">
        {{ connected() ? 'Aucun message pour l’instant' : 'Connexion au salon…' }}
      </span>
    }
  </p>

  <div class="showcase-chat-meta">
    @if (lastTimeLabel()) {
      <span class="showcase-chat-meta__time">{{ lastTimeLabel() }}</span>
    }
    <button
      type="button"
      class="showcase-chat-meta__refresh"
      (click)="onRefresh($event)"
      aria-label="Actualiser le chat"
    >
      <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
        <path d="M21 12a9 9 0 0 1-15.5 6.36" />
        <path d="M3 12a9 9 0 0 1 15.5-6.36" />
        <path d="M17 4v4h-4" />
        <path d="M7 20v-4h4" />
      </svg>
    </button>
  </div>
</div>
