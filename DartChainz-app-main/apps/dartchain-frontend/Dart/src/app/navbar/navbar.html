<header class="navbar-wrap">
  <div class="navbar-top-shell">
    <nav class="navbar-top" aria-label="Navigation principale">
      <div class="navbar-brand-column">
        <div class="navbar-brand-row">
          <div
            class="logo-shell"
            role="button"
            tabindex="0"
            aria-label="Interagir avec le logo R4V3"
            [class.logo-clicked]="logoClicked"
            (keydown.enter)="onLogoPulse()"
            (keydown.space)="$event.preventDefault(); onLogoPulse()"
          >
            <div class="logo-frame">
              <app-r4v3-three
                #logoThree
                class="navbar-logo-three"
                presentation="navbar"
                [modelTargetSize]="28"
                [cameraFitFactor]="1.148"
                [frameBiasX]="0"
                [frameBiasY]="-0.12"
                [enableOrbit]="true"
                (logoTapped)="onLogoPulse()"
              />
            </div>
          </div>

          <app-brand-crypto-select class="navbar-brand-select" />

          <app-navbar-network-status
            #networkStatus
            class="navbar-brand-row__network"
          />
        </div>

        <div class="navbar-subtitle" aria-live="polite">
          <ng-content />
        </div>
      </div>

      <div class="navbar-node-panel" aria-label="Synchronisation du nœud">
        <div class="navbar-node-panel__box">
          <div class="navbar-node-panel__meta">
            <div class="navbar-node-panel__head">
              <span
                class="navbar-node-panel__led"
                [class.is-online]="networkStatus.health().ok"
                aria-hidden="true"
              ></span>
              <span class="navbar-node-panel__title">NODE</span>
            </div>
            <p class="navbar-node-panel__sync">
              SYNC
              <strong class="navbar-node-panel__pct">{{ networkStatus.syncPercentLabel() }}</strong>
            </p>
          </div>
          <div class="navbar-node-panel__chart" aria-hidden="true">
            <svg
              class="navbar-node-panel__spark"
              viewBox="0 0 48 16"
              preserveAspectRatio="none"
              focusable="false"
            >
              <polyline
                points="0,12 8,10 14,6 22,8 30,3 38,5 48,2"
                fill="none"
                stroke="currentColor"
                stroke-width="1.5"
                stroke-linecap="round"
                stroke-linejoin="round"
              />
            </svg>
          </div>
        </div>
      </div>

      <div class="navbar-auth-strip" role="group" aria-label="Compte utilisateur">
        @if (auth.isAuthenticated()) {
          <div class="navbar-auth-user" [title]="auth.user()?.email ?? ''">
            <span class="navbar-auth-user__name">{{ auth.user()?.username }}</span>
            <button
              type="button"
              class="navbar-auth-btn navbar-auth-btn--logout"
              (click)="onLogout()"
              aria-label="Se déconnecter"
              title="Déconnexion"
            >
              <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4" />
                <polyline points="16 17 21 12 16 7" />
                <line x1="21" y1="12" x2="9" y2="12" />
              </svg>
            </button>
          </div>
        } @else {
          <button
            type="button"
            class="navbar-auth-btn"
            (click)="onLogin()"
            aria-label="Connexion"
            title="Connexion"
          >
            <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
              <path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4" />
              <polyline points="10 17 15 12 10 7" />
              <line x1="15" y1="12" x2="3" y2="12" />
            </svg>
          </button>
          <button
            type="button"
            class="navbar-auth-btn navbar-auth-btn--register"
            (click)="onRegister()"
            aria-label="Inscription"
            title="Inscription"
          >
            <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
              <path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2" />
              <circle cx="9" cy="7" r="4" />
              <line x1="19" y1="8" x2="19" y2="14" />
              <line x1="22" y1="11" x2="16" y2="11" />
            </svg>
          </button>
        }
      </div>

      <div class="navbar-aux" role="group" aria-label="Outils et peers">
        <app-navbar-peer-status class="navbar-aux__peers" />
        <div class="navbar-aux__search">
          <app-explorer-search
            (selectBlock)="exploreBlock.emit($event)"
            (openPending)="explorePending.emit()"
          />
        </div>
      </div>
    </nav>
  </div>

  <app-auth-drawer />
</header>
