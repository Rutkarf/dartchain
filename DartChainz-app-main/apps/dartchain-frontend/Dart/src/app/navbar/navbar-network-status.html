<div class="navbar-network" role="status" [attr.aria-label]="statusAriaLabel()">
  <span class="navbar-network-metrics">
    @if (health().ok) {
      <span class="navbar-network-led-wrap is-online" aria-hidden="true">
        <span class="navbar-network-led"></span>
        <span class="navbar-network-led-aura"></span>
      </span>
    }<!--
    --><span class="navbar-network-latency">{{ latencyLabel() }}</span><!--
    --><button
      type="button"
      class="navbar-network-refresh"
      (click)="refresh()"
      [disabled]="loading()"
      aria-label="Rafraîchir l'état réseau"
    >
      <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
        <path d="M21 12a9 9 0 0 1-15.5 6.36" />
        <path d="M3 12a9 9 0 0 1 15.5-6.36" />
        <path d="M17 4v4h-4" />
        <path d="M7 20v-4h4" />
      </svg>
    </button>
  </span>
</div>
