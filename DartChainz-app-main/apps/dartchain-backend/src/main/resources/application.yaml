server:
  port: ${PORT:8080}

dartchain:
  persistence:
    mode: ${DARTCHAIN_PERSISTENCE_MODE:memory}

spring:
  application:
    name: dartchain-backend

exchange:
  ledger:
    path: ${EXCHANGE_LEDGER_PATH:data/exchange-ledger.json}

auth:
  users:
    path: ${AUTH_USERS_PATH:data/auth-users.json}
  session:
    ttl-seconds: ${AUTH_SESSION_TTL_SECONDS:604800}
