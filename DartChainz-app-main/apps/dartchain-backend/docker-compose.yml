services:
  postgres:
    image: postgres:16
    container_name: dartchain-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: dartchain
      POSTGRES_USER: dartchain
      POSTGRES_PASSWORD: dartchain
    volumes:
      - dartchain_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dartchain -d dartchain"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  dartchain_pg_data:
