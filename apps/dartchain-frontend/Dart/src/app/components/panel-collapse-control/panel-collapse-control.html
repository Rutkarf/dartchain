<button
  type="button"
  class="panel-collapse-control showcase-toggle"
  [class.is-collapsed]="collapsed()"
  [attr.aria-label]="ariaLabel()"
  [attr.title]="ariaLabel()"
  [attr.aria-expanded]="!collapsed()"
  (click)="onActivate($event)"
  (pointerdown)="$event.stopPropagation()"
>
  <svg
    class="icon panel-collapse-control__chevron"
    aria-hidden="true"
    focusable="false"
  >
    <use [attr.href]="collapsed() ? '#icon-chevron-down' : '#icon-chevron-up'" />
  </svg>
</button>
