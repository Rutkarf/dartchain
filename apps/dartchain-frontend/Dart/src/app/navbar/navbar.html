<header class="navbar-wrap">
  <div class="navbar-top-shell">
    <nav class="navbar-top ds-surface ds-surface--strip" aria-label="Navigation principale">
      <div class="navbar-brand-stack">
        <div class="navbar-brand-head" #brandHead>
          <div class="navbar-brand-track" #brandTrack>
            <div class="navbar-brand-row" #brandRow>
              <div
                class="logo-shell"
                role="button"
                tabindex="0"
                aria-label="Interagir avec le logo R4V3"
                appNavbarHint="Double-clic rapide pour basculer la scène 3D R4V3"
                [class.logo-clicked]="logoClicked"
                (keydown.enter)="onLogoPulse()"
                (keydown.space)="$event.preventDefault(); onLogoPulse()"
              >
                <div class="logo-frame">
                  <app-r4v3-three
                    #logoThree
                    class="navbar-logo-three"
                    presentation="navbar"
                    [modelTargetSize]="38"
                    [cameraFitFactor]="1.148"
                    [frameBiasX]="0"
                    [frameBiasY]="-0.12"
                    [enableOrbit]="true"
                    (logoTapped)="onLogoPulse()"
                  />
                </div>
              </div>

              <app-brand-crypto-select class="navbar-brand-select" />

              <app-navbar-network-status
                #networkStatus
                class="navbar-brand-row__network"
              />

              <app-navbar-node-panel class="navbar-brand-row__node" />
            </div>

            <div class="navbar-ticker-slot">
              <div class="navbar-ticker" aria-live="polite">
                <ng-content />
              </div>
              <app-navbar-ticker-drawer />
            </div>
          </div>
        </div>
      </div>

      @switch (authStripMode()) {
        @case ('logout') {
          <div class="navbar-auth-strip" role="group" aria-label="Compte utilisateur">
            <button
              type="button"
              class="navbar-auth-btn navbar-auth-btn--logout"
              (click)="onLogout()"
              [attr.aria-label]="'Se déconnecter · ' + (auth.user()?.username ?? auth.user()?.email ?? 'compte')"
              appNavbarHint="Fermer la session et revenir au mode invité"
            >
              <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4" />
                <polyline points="16 17 21 12 16 7" />
                <line x1="21" y1="12" x2="9" y2="12" />
              </svg>
            </button>
          </div>
        }
        @case ('guest') {
          <div class="navbar-auth-strip" role="group" aria-label="Compte utilisateur">
            <button
              type="button"
              class="navbar-auth-btn"
              (click)="onLogin()"
              aria-label="Connexion"
              appNavbarHint="Ouvrir le panneau de connexion pour accéder à votre compte DartChain"
            >
              <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                <path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4" />
                <polyline points="10 17 15 12 10 7" />
                <line x1="15" y1="12" x2="3" y2="12" />
              </svg>
            </button>
            <button
              type="button"
              class="navbar-auth-btn navbar-auth-btn--register"
              (click)="onRegister()"
              aria-label="Inscription"
              appNavbarHint="Créer un compte gratuit pour accéder au LaunchLab et aux fonctionnalités réseau"
            >
              <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                <path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2" />
                <circle cx="9" cy="7" r="4" />
                <line x1="19" y1="8" x2="19" y2="14" />
                <line x1="22" y1="11" x2="16" y2="11" />
              </svg>
            </button>
          </div>
        }
      }

      <div class="navbar-aux" role="group" aria-label="Outils et peers">
        <app-navbar-peer-status class="navbar-aux__peers" />
        <div class="navbar-aux__searchbar">
          <app-searchbar (openPending)="explorePending.emit()" />
        </div>
        <div class="navbar-aux__search">
          <app-explorer-search
            (selectBlock)="exploreBlock.emit($event)"
            (openPending)="explorePending.emit()"
          />
        </div>
      </div>
    </nav>
  </div>
</header>
