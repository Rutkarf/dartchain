<div #anchorRoot class="network-trust-anchor">
  <button
    type="button"
    class="network-trust-chip"
    [class.is-live]="trust.trustState() === 'live'"
    [class.is-slow]="trust.trustState() === 'slow'"
    [class.is-offline]="trust.trustState() === 'offline'"
    [class.is-checking]="trust.trustState() === 'checking'"
    [class.is-stream-live]="trust.streamLive()"
    [class.is-panel-open]="panelOpen()"
    [attr.aria-expanded]="panelOpen()"
    aria-haspopup="dialog"
    [attr.aria-label]="trust.chipAriaLabel()"
    (click)="openDetails($event)"
  >
    <span class="network-trust-chip__led-wrap nv-drawer-led-anchor" aria-hidden="true">
      <span class="network-trust-chip__led"></span>
    </span>
    <span class="network-trust-chip__label">{{ trust.chipLabel() }}</span>
    <span class="network-trust-chip__detail">{{ trust.latencyLabel() }}</span>
  </button>

  @if (panelOpen()) {
    <aside
      class="nv-anchor-drawer nv-anchor-drawer--live"
      role="dialog"
      aria-label="État réseau détaillé"
      [appFocusTrap]="true"
      (click)="onDrawerClick($event)"
    >
      <app-status-overlay />
    </aside>
  }
</div>
