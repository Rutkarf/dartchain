<div
  class="collapsed-bar-actions"
  role="toolbar"
  [attr.aria-label]="'Menu actions panneau'"
  (click)="$event.stopPropagation()"
>
  <button
    type="button"
    class="collapsed-bar-actions__refresh"
    [class.is-busy]="refreshBusy()"
    [attr.aria-busy]="refreshBusy()"
    [attr.aria-label]="refreshAriaLabel()"
    [attr.title]="refreshAriaLabel()"
    (click)="onRefresh($event)"
  >
    <app-icon-relief-3d kind="refresh" [spinning]="refreshBusy()" />
  </button>

  <span class="collapsed-bar-actions__rail" aria-hidden="true"></span>

  <app-panel-collapse-control
    class="collapsed-bar-actions__collapse"
    [collapsed]="collapsed()"
    [ariaLabel]="collapseAriaLabel()"
    (toggle)="collapseToggle.emit()"
  />
</div>
