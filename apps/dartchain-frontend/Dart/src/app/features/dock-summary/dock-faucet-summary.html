<div
  class="faucet-summary-bar"
  role="status"
  aria-live="polite"
  [attr.aria-label]="barAriaLabel()"
>
  <span class="faucet-summary-bar__balance" [attr.title]="headline()">
    {{ headline() }}
  </span>

  <button
    type="button"
    class="faucet-summary-bar__claim"
    [disabled]="claimDisabled()"
    [class.is-cooling]="isCooling()"
    (click)="onClaim($event)"
    aria-label="Claim faucet"
    title="Claim"
  >
    CLAIM
  </button>
</div>
