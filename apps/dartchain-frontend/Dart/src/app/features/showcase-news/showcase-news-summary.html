<div
  class="news-summary-bar"
  role="button"
  tabindex="0"
  aria-live="polite"
  [attr.aria-label]="barAriaLabel()"
  (click)="onBarClick($event)"
  (keydown.enter)="onBarKeydown($event)"
  (keydown.space)="onBarKeydown($event)"
>
  <div class="news-summary-bar__headline-wrap">
    @if (loading()) {
      <span class="news-summary-bar__headline news-summary-bar__headline--muted">Chargement…</span>
    } @else {
      <span
        class="news-summary-bar__headline"
        [class.news-summary-bar__headline--muted]="!newsState.collapsedPrimaryItem()"
        [attr.title]="newsState.collapsedHeadlineTitle()"
      >
        {{ newsState.collapsedHeadlineTitle() }}
      </span>
    }
  </div>

  @if (headlineAge()) {
    <span class="news-summary-bar__age">{{ headlineAge() }}</span>
  }

  @if (hasUnread()) {
    <button
      type="button"
      class="news-summary-bar__unread-toast"
      [class.news-summary-bar__unread-toast--live]="isUnreadToastLive()"
      [attr.aria-label]="unreadToastAriaLabel()"
      (click)="onUnreadToastClick($event)"
    >
      <span class="news-summary-bar__unread-toast-count" aria-hidden="true">{{ unreadBadgeLabel() }}</span>
    </button>
  }

  <button
    type="button"
    class="news-summary-bar__refresh"
    (click)="onRefresh($event)"
    [class.news-summary-bar__refresh--loading]="loading()"
    [attr.aria-busy]="loading()"
    aria-label="Actualiser les actualités"
  >
    <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
      <path d="M21 12a9 9 0 0 1-15.5 6.36" />
      <path d="M3 12a9 9 0 0 1 15.5-6.36" />
      <path d="M17 4v4h-4" />
      <path d="M7 20v-4h4" />
    </svg>
  </button>
</div>
