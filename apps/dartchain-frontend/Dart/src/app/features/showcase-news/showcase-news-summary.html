<div
  class="news-summary-bar"
  role="button"
  tabindex="0"
  aria-live="polite"
  [attr.aria-label]="barAriaLabel()"
  (click)="onBarClick($event)"
  (keydown.enter)="onBarKeydown($event)"
  (keydown.space)="onBarKeydown($event)"
>
  <!-- Chip hors du 1fr : même 22×7 que la liste dépliée, P2P / NET / INFO identiques -->
  <span class="news-summary-bar__cat" [attr.data-category]="categorySlug()">
    <span
      class="news-summary-bar__pastille"
      aria-hidden="true"
      [attr.data-category]="categorySlug()"
    ></span>
    <span
      class="showcase-news__tag"
      [attr.data-category]="categorySlug()"
    >
      <span
        class="showcase-news__tag-badge"
        [attr.title]="newsState.categoryLabel(activeItem()?.category ?? 'INFO')"
      >
        {{ categoryBadge() }}
      </span>
    </span>
  </span>

  <div class="news-summary-bar__headline-wrap">
    @if (loading()) {
      <span class="news-summary-bar__headline news-summary-bar__headline--muted">Chargement…</span>
    } @else {
      <span
        class="news-summary-bar__headline-stack"
        [class.is-transitioning]="isTransitioning()"
        [attr.data-rotation]="activeHeadlineIndex()"
      >
        @if (isTransitioning() && previousHeadlineTitle()) {
          <span
            class="news-summary-bar__headline news-summary-bar__headline--out"
            [attr.title]="previousHeadlineTitle()"
          >
            {{ previousHeadlineTitle() }}
          </span>
        }
        <span
          class="news-summary-bar__headline"
          [class.news-summary-bar__headline--muted]="!activeItem() && !newsState.collapsedPrimaryItem()"
          [class.news-summary-bar__headline--in]="isTransitioning()"
          [attr.title]="headlineTitle()"
          [style.fontSize]="'clamp(0.375rem, 2.35vw, 0.5625rem)'"
          [style.fontWeight]="600"
          [style.lineHeight]="1.1"
        >
          {{ headlineTitle() }}
        </span>
      </span>
    }
  </div>

  @if (headlineAge()) {
    <span class="news-summary-bar__age-stack" [class.is-transitioning]="isTransitioning()">
      @if (isTransitioning() && previousHeadlineAge()) {
        <span
          class="news-summary-bar__age news-summary-bar__age--out"
          [style.fontSize]="'clamp(0.3375rem, 2vw, 0.4375rem)'"
          [style.fontWeight]="600"
        >{{ previousHeadlineAge() }}</span>
      }
      <span
        class="news-summary-bar__age"
        [class.news-summary-bar__age--in]="isTransitioning()"
        [style.fontSize]="'clamp(0.3375rem, 2vw, 0.4375rem)'"
        [style.fontWeight]="600"
      >{{ headlineAge() }}</span>
    </span>
  }

  <div class="news-summary-bar__actions" aria-label="Navigation entre actualités">
    <button
      type="button"
      class="news-summary-bar__action-btn"
      [disabled]="!canNavigatePrev()"
      aria-label="Actualité précédente"
      (click)="navigatePrev($event)"
    >
      ‹
    </button>
    <button
      type="button"
      class="news-summary-bar__action-btn"
      [disabled]="!canNavigateNext()"
      aria-label="Actualité suivante"
      (click)="navigateNext($event)"
    >
      ›
    </button>
    <button
      type="button"
      class="news-summary-bar__action-btn news-summary-bar__action-btn--copy"
      [class.is-copied]="copied()"
      [class.is-failed]="copyFailed()"
      [attr.aria-live]="copied() || copyFailed() ? 'polite' : null"
      [attr.aria-label]="copyButtonLabel()"
      [attr.title]="copyButtonLabel()"
      (click)="copyCurrent($event)"
    >
      @if (copied()) {
        <span class="news-summary-bar__copy-ok" aria-hidden="true">✓</span>
      } @else {
        <svg
          class="news-summary-bar__copy-icon"
          viewBox="0 0 16 16"
          aria-hidden="true"
          focusable="false"
        >
          <rect x="5" y="5" width="8" height="8" rx="1" />
          <path d="M5 9H4a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1h5a1 1 0 0 1 1 1v1" />
        </svg>
      }
    </button>
  </div>
</div>
