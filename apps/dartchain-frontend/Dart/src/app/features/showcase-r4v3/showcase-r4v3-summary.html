<div
  class="r4v3-summary-bar"
  role="button"
  tabindex="0"
  aria-live="polite"
  [attr.aria-label]="barAriaLabel()"
  (click)="onBarClick($event)"
  (keydown.enter)="onBarKeydown($event)"
  (keydown.space)="onBarKeydown($event)"
>
  <span class="r4v3-summary-bar__status-cluster">
    <span
      class="r4v3-summary-bar__led"
      [class]="systemStatusClass(systemStatus())"
      aria-hidden="true"
    ></span>
    <span class="r4v3-summary-bar__peg">{{ pegDisplayLabel() }}</span>
  </span>

  <div class="r4v3-summary-bar__ticker" aria-live="polite">
    @if (tickerQuestion(); as question) {
      <div class="r4v3-summary-bar__ticker-viewport">
        <div
          class="r4v3-summary-bar__ticker-track"
          [class.r4v3-summary-bar__ticker-track--scroll]="tickerNeedsScroll(question.title)"
        >
          <span class="r4v3-summary-bar__ticker-text">{{ question.title }}</span>
          @if (tickerNeedsScroll(question.title)) {
            <span class="r4v3-summary-bar__ticker-text" aria-hidden="true">{{ question.title }}</span>
          }
        </div>
      </div>
    } @else if (headerBusy()) {
      <span class="r4v3-summary-bar__ticker-fallback">Chargement FAQ…</span>
    } @else {
      <span class="r4v3-summary-bar__ticker-fallback">Posez la première question communautaire</span>
    }
  </div>

  <button
    type="button"
    class="r4v3-summary-bar__whitepaper"
    (click)="onWhitepaper($event)"
    [attr.aria-label]="whitepaperAriaLabel()"
    [attr.aria-busy]="whitepaperLoading()"
    title="White paper"
  >
    <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
      <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z" />
      <path d="M14 2v6h6M16 13H8M16 17H8M10 9H8" />
    </svg>
  </button>

  <button
    type="button"
    class="r4v3-summary-bar__refresh"
    (click)="onRefresh($event)"
    [class.r4v3-summary-bar__refresh--loading]="headerBusy()"
    [class.r4v3-summary-bar__refresh--pulse]="refreshPulse()"
    [attr.aria-busy]="headerBusy()"
    aria-label="Actualiser le hub R4V3"
  >
    <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
      <path d="M21 12a9 9 0 0 1-15.5 6.36" />
      <path d="M3 12a9 9 0 0 1 15.5-6.36" />
      <path d="M17 4v4h-4" />
      <path d="M7 20v-4h4" />
    </svg>
  </button>

  <button
    type="button"
    class="r4v3-summary-bar__swap"
    (click)="onSwap($event)"
    aria-label="Ouvrir le swap R4V3"
  >
    ⇄
  </button>
</div>
