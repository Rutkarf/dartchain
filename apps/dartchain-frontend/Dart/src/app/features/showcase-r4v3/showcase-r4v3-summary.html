<div class="r4v3-summary-bar" role="status" aria-live="polite" aria-label="Résumé R4V3">
  <div class="r4v3-summary-main">
    <span class="r4v3-summary-main__rail" aria-hidden="true"></span>
    <span class="r4v3-summary-main__brand">R4V3</span>

    @if (unreadCount() > 0) {
      <span class="r4v3-summary-main__badge" [attr.aria-label]="unreadCount() + ' non lues'">
        {{ unreadCount() > 9 ? '9+' : unreadCount() }}
      </span>
    }

    <p class="r4v3-summary-main__text">
      @if (previewText()) {
        <span>{{ previewText() }}</span>
      } @else if (loading()) {
        <span class="r4v3-summary-main__text--muted">Chargement…</span>
      } @else {
        <span class="r4v3-summary-main__text--muted">{{ walletHeadline() }}</span>
      }
    </p>
  </div>

  <div class="r4v3-summary-meta">
    @if (updatedAgeLabel()) {
      <span class="r4v3-summary-meta__time">{{ updatedAgeLabel() }}</span>
    }
  </div>

  <div class="r4v3-summary-actions">
    <button
      type="button"
      class="r4v3-summary-actions__refresh"
      (click)="onRefresh($event)"
      [attr.aria-busy]="loading()"
      aria-label="Actualiser R4V3"
    >
      <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
        <path d="M21 12a9 9 0 0 1-15.5 6.36" />
        <path d="M3 12a9 9 0 0 1 15.5-6.36" />
        <path d="M17 4v4h-4" />
        <path d="M7 20v-4h4" />
      </svg>
    </button>
    <button type="button" class="r4v3-summary-actions__swap" (click)="onSwap($event)">
      Swap
    </button>
  </div>
</div>
