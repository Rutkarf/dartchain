<div class="showcase-view showcase-view--r4v3" role="region" aria-label="Hub d'information R4V3">
  @if (isExpanded) {
    <div class="showcase-r4v3__peg-banner" [attr.aria-label]="liveAriaLabel()">
      <span
        class="showcase-r4v3__status-led showcase-r4v3__status-led--banner"
        [class]="systemStatusClass(systemStatus())"
        aria-hidden="true"
      ></span>
      <span class="showcase-r4v3__peg showcase-r4v3__peg--hero">{{ pegDisplayLabel() }}</span>
      <button
        type="button"
        class="showcase-r4v3__doc-icon showcase-r4v3__doc-icon--peg"
        (click)="openWhitepaper($event)"
        [attr.aria-label]="whitepaperLoading() ? 'Ouverture…' : 'White paper R4V3'"
        [attr.aria-busy]="whitepaperLoading()"
        title="White paper"
      >
        <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
          <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z" />
          <path d="M14 2v6h6M16 13H8M16 17H8M10 9H8" />
        </svg>
      </button>
    </div>

    @if (whitepaperFeedback()) {
      <p class="showcase-r4v3__doc-feedback" role="status">{{ whitepaperFeedback() }}</p>
    }

    <div #contentPanel class="showcase-r4v3__content">
      <div class="showcase-r4v3__dashboard">
        <section class="showcase-r4v3__hero" aria-label="Piliers R4V3">
          <div class="showcase-r4v3__pillar-grid">
            @for (column of pillarColumns; track column[0].id; let colIndex = $index) {
              <div class="showcase-r4v3__pillar-column" [attr.aria-label]="'Colonne ' + (colIndex + 1)">
                @for (pillar of column; track pillar.id) {
                  <button
                    type="button"
                    class="showcase-r4v3__pillar"
                    [class]="pillarAccentClass(pillar)"
                    (click)="openPillar(pillar)"
                    [attr.aria-label]="pillar.label + ' — ' + pillar.detail"
                  >
                    <span class="showcase-r4v3__pillar-glow" aria-hidden="true"></span>
                    <span class="showcase-r4v3__pillar-icon" aria-hidden="true">{{ pillar.icon }}</span>
                    <span class="showcase-r4v3__pillar-copy">
                      <strong class="showcase-r4v3__pillar-label">{{ pillar.label }}</strong>
                      <span class="showcase-r4v3__pillar-detail">{{ pillar.detail }}</span>
                    </span>
                    <span class="showcase-r4v3__pillar-chevron" aria-hidden="true">›</span>
                  </button>
                }
              </div>
            }
          </div>
        </section>

        <nav class="showcase-r4v3__section-nav" aria-label="Wiki et FAQ communautaire">
          <button
            type="button"
            class="showcase-r4v3__section-link showcase-r4v3__section-link--official"
            (click)="openOfficialWiki()"
            aria-haspopup="dialog"
            [attr.aria-label]="'Base officielle — ' + faqCountLabel()"
          >
            <span class="showcase-r4v3__section-link-label">Base officielle</span>
          </button>

          <button
            type="button"
            class="showcase-r4v3__section-link showcase-r4v3__section-link--community"
            (click)="openCommunityFormDrawer()"
            aria-haspopup="dialog"
            [attr.aria-label]="'FAQ communautaire — ' + communityCountLabel()"
          >
            <span class="showcase-r4v3__section-link-label">FAQ communautaire</span>
          </button>
        </nav>
      </div>
    </div>

    <app-showcase-r4v3-hub-drawer
      [payload]="drawerPayload()"
      [showBackToWiki]="drawerOpenedFromWiki() && drawerPayload()?.kind === 'faq'"
      [canPrev]="canNavigatePrev()"
      [canNext]="canNavigateNext()"
      [itemIndex]="drawerNavIndex()"
      [itemTotal]="drawerNavTotal()"
      (closeDrawer)="closeDrawer()"
      (backToWiki)="backToOfficialWiki()"
      (navigatePrev)="navigatePrev()"
      (navigateNext)="navigateNext()"
      (runAction)="runDrawerAction($event)"
      (selectOfficialEntry)="openEntry($event, true)"
      (communityQuestionSubmitted)="onCommunityQuestionSubmitted()"
    />
  }
</div>
