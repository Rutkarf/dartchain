<div
  class="launch-summary-bar"
  role="status"
  aria-live="polite"
  aria-label="Résumé des lancements"
>
  <div class="launch-summary-main">
    <span class="launch-summary-main__rail" aria-hidden="true"></span>
    <span
      class="launch-summary-status"
      [ngClass]="phaseClass(phase())"
      [attr.aria-label]="'État : ' + statusLabel()"
    >
      {{ statusLabel() }}
    </span>
    @if (counts().total > 0) {
      <span class="launch-summary-main__count" [attr.aria-label]="counts().total + ' projets'">
        {{ counts().total }}
      </span>
    }
  </div>

  <div class="launch-summary-progress">
    <span class="launch-summary-progress__track" aria-hidden="true">
      <span
        class="launch-summary-progress__fill"
        [style.width.%]="progressPercent()"
      ></span>
    </span>
    <p class="launch-summary-progress__text">
      @if (headline()) {
        <span>{{ headline() }}</span>
      } @else {
        <span class="launch-summary-progress__text--muted">{{ progressLabel() }}</span>
      }
    </p>
  </div>

  <div class="launch-summary-meta">
    @if (updatedAgeLabel()) {
      <span class="launch-summary-meta__time">{{ updatedAgeLabel() }}</span>
    }
  </div>

  <div class="launch-summary-actions">
    <button
      type="button"
      class="launch-summary-actions__refresh"
      (click)="onRefresh($event)"
      [attr.aria-busy]="loading()"
      aria-label="Actualiser les lancements"
    >
      <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
        <path d="M21 12a9 9 0 0 1-15.5 6.36" />
        <path d="M3 12a9 9 0 0 1 15.5-6.36" />
        <path d="M17 4v4h-4" />
        <path d="M7 20v-4h4" />
      </svg>
    </button>
    <button
      type="button"
      class="launch-summary-actions__launch"
      (click)="onLaunch($event)"
      aria-label="Lancer un projet"
    >
      Lancer
    </button>
  </div>
</div>
