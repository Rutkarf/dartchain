<div
  class="launch-summary-bar"
  role="status"
  aria-live="polite"
  aria-label="Résumé LaunchLab"
>
  <div class="launch-summary-main launch-summary-main--dynamic">
    <span
      class="launch-summary-status launch-summary-status--cluster"
      [ngClass]="phaseClass()"
      [attr.aria-label]="'Statut : ' + collapsedStatusHeadline()"
      [attr.title]="collapsedStatusHeadline()"
    >
      {{ collapsedStatusHeadline() }}
    </span>
  </div>

  <div class="launch-summary-ticker" aria-live="polite">
    @if (carouselProject(); as project) {
      <div class="launch-summary-ticker__viewport">
        <div
          class="launch-summary-ticker__slide"
          [class.launch-summary-ticker__slide--enter]="carouselAnimating()"
        >
          <span class="launch-summary-ticker__symbol">{{ project.symbol }}</span>
          <span class="launch-summary-ticker__cap">{{ marketCapLabel(project) }}</span>
        </div>
      </div>
    } @else if (loading()) {
      <span class="launch-summary-ticker__fallback">Synchronisation…</span>
    } @else {
      <span class="launch-summary-ticker__fallback">Aucun projet actif</span>
    }
  </div>

  <div class="launch-summary-meta">
    @if (updatedAgeLabel()) {
      <span class="launch-summary-meta__time">{{ updatedAgeLabel() }}</span>
    }
  </div>

  <div class="launch-summary-actions">
    <button
      type="button"
      class="launch-summary-actions__refresh"
      [class.launch-summary-actions__refresh--loading]="loading()"
      (click)="onRefresh($event)"
      [attr.aria-busy]="loading()"
      aria-label="Actualiser les lancements"
    >
      <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
        <path d="M21 12a9 9 0 0 1-15.5 6.36" />
        <path d="M3 12a9 9 0 0 1 15.5-6.36" />
        <path d="M17 4v4h-4" />
        <path d="M7 20v-4h4" />
      </svg>
    </button>
  </div>
</div>
