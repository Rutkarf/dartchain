<section class="status-drawer status-drawer--network" [attr.aria-label]="'État réseau · ' + trust.statusHeadline()">
  <div class="status-drawer__toolbar">
    <div class="status-drawer__actions">
      <button
        type="button"
        class="status-drawer__refresh"
        (click)="refresh($event)"
        [disabled]="trust.loading()"
        [class.is-spinning]="trust.loading()"
        aria-label="Rafraîchir l'état réseau"
      >
        <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
          <path d="M21 12a9 9 0 0 1-15.5 6.36" />
          <path d="M3 12a9 9 0 0 1 15.5-6.36" />
          <path d="M17 4v4h-4" />
          <path d="M7 20v-4h4" />
        </svg>
      </button>
      <button
        type="button"
        class="status-drawer__close"
        (click)="close($event)"
        aria-label="Fermer le panneau réseau"
      >
        ×
      </button>
    </div>
  </div>

  <div class="status-drawer__metrics status-drawer__metrics--network" role="list">
    <div
      class="status-drawer__cell status-drawer__cell--latency"
      role="listitem"
      [class.is-excellent]="latencyTier() === 'excellent'"
      [class.is-good]="latencyTier() === 'good'"
      [class.is-slow]="latencyTier() === 'slow'"
      [class.is-poor]="latencyTier() === 'poor'"
      [class.is-checking]="latencyTier() === 'checking'"
      [class.is-unknown]="latencyTier() === 'unknown'"
    >
      <span class="status-drawer__label">Latence API</span>
      <span class="status-drawer__value">{{ displayLatency() }}</span>
      <span class="status-drawer__gauge" aria-hidden="true">
        <span class="status-drawer__gauge-fill" [style.width.%]="latencyGaugeWidth()"></span>
      </span>
    </div>

    <div
      class="status-drawer__cell status-drawer__cell--api"
      role="listitem"
      [class.is-ok]="apiTone() === 'ok'"
      [class.is-error]="apiTone() === 'error'"
      [class.is-checking]="apiTone() === 'checking'"
    >
      <span class="status-drawer__label">API</span>
      <span class="status-drawer__value-row">
        <span
          class="status-drawer__dot"
          [class.is-ok]="apiTone() === 'ok'"
          [class.is-error]="apiTone() === 'error'"
          [class.is-checking]="apiTone() === 'checking'"
          aria-hidden="true"
        ></span>
        <span class="status-drawer__value">{{ apiShortLabel() }}</span>
      </span>
    </div>

    <div
      class="status-drawer__cell status-drawer__cell--stream"
      role="listitem"
      [class.is-live]="trust.streamLive()"
    >
      <span class="status-drawer__label">Flux live</span>
      <span class="status-drawer__value-row">
        <span class="status-drawer__dot-wrap" aria-hidden="true">
          @if (trust.streamLive()) {
            <span class="status-drawer__dot-pulse"></span>
          }
          <span class="status-drawer__dot" [class.is-live]="trust.streamLive()"></span>
        </span>
        <span class="status-drawer__value">{{ trust.streamLive() ? 'Actif' : 'Off' }}</span>
      </span>
    </div>
  </div>

  @if (trust.errorMessage(); as errorMessage) {
    <div class="status-drawer__error" role="alert">
      {{ errorMessage }}
    </div>
  }
</section>
