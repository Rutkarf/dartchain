<div
  class="bandeau-accueil"
  role="region"
  aria-label="Bandeau d'annonces — faites glisser pour parcourir"
  [class.bandeau-accueil--dragging]="isDragging"
  (pointerdown)="onPointerDown($event)"
  (pointermove)="onPointerMove($event)"
  (pointerup)="onPointerUp($event)"
  (pointercancel)="onPointerCancel($event)"
>
  <div #viewport class="bandeau-accueil__viewport">
    <div #track class="bandeau-accueil__track">
      <div
        class="bandeau-accueil__content"
        *ngFor="let _ of marqueeCopies; let i = index"
        [attr.aria-hidden]="i > 0 ? 'true' : null"
      >
        <ng-container *ngFor="let segment of ticker.segments(); let last = last">
          <span [class]="'bandeau-accueil__chip bandeau-accueil__chip--' + segment.id">
            <span class="bandeau-accueil__label">{{ segment.label }}</span>
            <span class="bandeau-accueil__value">{{ segment.value }}</span>
          </span>
          <span *ngIf="!last" class="bandeau-accueil__sep" aria-hidden="true"></span>
        </ng-container>
      </div>
    </div>
  </div>
</div>
