<section class="transactions-dock ds-surface ds-surface--showcase-body" aria-label="Transaction dock">
  <header class="transactions-dock__head">
    @if (latestBlock(); as block) {
      <button
        type="button"
        class="transactions-dock__block"
        (click)="openLatestBlock()"
        [attr.aria-label]="'Ouvrir le bloc #' + block.index"
      >
        BLOCK #{{ block.index }}
      </button>
    } @else {
      <span class="transactions-dock__block transactions-dock__block--static">BLOCK —</span>
    }

    <div class="transactions-dock__alert" aria-live="polite">
      @if (composerError(); as error) {
        <p class="transactions-dock__alert-text transactions-dock__alert-text--error">{{ error }}</p>
      } @else if (composerSuccess(); as success) {
        <p class="transactions-dock__alert-text transactions-dock__alert-text--success">{{ success }}</p>
      }
    </div>

  </header>

  <div class="transactions-dock__scroll">
    <div class="transactions-dock__composer" #composerPanel>
      <app-block-composer
        [embedded]="true"
        [compact]="true"
        [showCompactToolbar]="false"
        [hideCompactTip]="true"
        [externalSubmit]="true"
      />
    </div>

    <div class="transactions-dock__split" aria-hidden="true"></div>

    <div class="transactions-dock__mempool" #mempoolPanel>
      <app-pending-transactions
        [embedded]="true"
        [compact]="true"
        [hideCompactBar]="true"
      />
    </div>
  </div>

  <footer class="transactions-dock__footer">
    <button
      type="submit"
      class="transactions-dock__submit"
      form="block-composer-compact-form"
      [disabled]="composerLoading()"
      [attr.aria-busy]="composerLoading()"
    >
      {{ locale.t('transactions.createTx') }}
    </button>
  </footer>
</section>
