<section
  class="transactions-dock transactions-dock--mempool ds-surface ds-surface--showcase-body"
  aria-label="Mempool"
>
  <header class="transactions-dock__head">
    @if (latestBlock(); as block) {
      <button
        type="button"
        class="transactions-dock__block"
        (click)="openLatestBlock()"
        [attr.aria-label]="'Ouvrir le bloc #' + block.index"
      >
        BLOCK #{{ block.index }}
      </button>
    } @else {
      <span class="transactions-dock__block transactions-dock__block--static">BLOCK —</span>
    }

    <div class="transactions-dock__stats" aria-live="polite">
      <span
        class="transactions-dock__live-dot"
        [class.is-active]="pendingCount() > 0"
        aria-hidden="true"
      ></span>
      <span class="transactions-dock__stats-count">{{ mempoolSummary() }}</span>
      @if (pendingTotalLabel()) {
        <span class="transactions-dock__stats-total">· {{ pendingTotalLabel() }}</span>
      }
    </div>

    <div class="transactions-dock__tools">
      <input
        type="search"
        class="transactions-dock__filter"
        [placeholder]="locale.t('transactions.filter')"
        [attr.aria-label]="locale.t('transactions.filter')"
        [value]="filterQuery()"
        (input)="onFilterInput($any($event.target).value)"
      />
      <button
        type="button"
        class="transactions-dock__refresh"
        (click)="refreshAll()"
        [attr.aria-label]="locale.t('transactions.refreshAll')"
        [title]="locale.t('transactions.refreshAll')"
      >
        ↻
      </button>
    </div>
  </header>

  <div class="transactions-dock__body">
    <div class="transactions-dock__mempool">
      <app-pending-transactions
        #pendingPanel
        [embedded]="true"
        [compact]="true"
        [hideCompactBar]="true"
        [maxVisibleRows]="visibleRowBudget()"
        [externalSearchQuery]="filterQuery()"
      />
    </div>
  </div>

  <footer class="transactions-dock__footer">
    <button
      type="button"
      class="transactions-dock__submit"
      (click)="mineAllPending()"
      [disabled]="!canMineAll()"
      [attr.aria-busy]="miningAllBusy()"
    >
      {{ miningAllBusy() ? locale.t('transactions.miningAll') : locale.t('transactions.mineAll') }}
    </button>
  </footer>
</section>
