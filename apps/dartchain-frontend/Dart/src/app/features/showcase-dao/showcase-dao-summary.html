<div
  class="dao-summary-bar"
  role="status"
  aria-live="polite"
  aria-label="Résumé gouvernance D.A.O"
>
  <div class="dao-summary-main dao-summary-main--dynamic">
    <span
      class="dao-summary-status dao-summary-status--cluster"
      [ngClass]="badgeClass()"
      [attr.aria-label]="'Statut : ' + collapsedHeadline()"
      [attr.title]="collapsedHeadline()"
    >
      <span
        class="dao-summary-status__led"
        [class.dao-summary-status__led--dim]="daoState.activeCount() === 0"
        aria-hidden="true"
      ></span>
      {{ collapsedHeadline() }}
    </span>
  </div>

  <div class="dao-summary-ticker" aria-live="polite">
    @if (carouselCard(); as card) {
      <div class="dao-summary-ticker__viewport">
        <div
          class="dao-summary-ticker__slide"
          [class.dao-summary-ticker__slide--enter]="carouselAnimating()"
        >
          <span class="dao-summary-ticker__symbol">{{ card.symbol }} DAO</span>
          <span class="dao-summary-ticker__access">Accès DAO →</span>
        </div>
      </div>
    } @else if (loading()) {
      <span class="dao-summary-ticker__fallback">Synchronisation…</span>
    } @else {
      <span class="dao-summary-ticker__fallback">Aucune DAO active</span>
    }
  </div>

  <div class="dao-summary-meta">
    @if (updatedAgeLabel()) {
      <span class="dao-summary-meta__time">{{ updatedAgeLabel() }}</span>
    }
  </div>

  <div class="dao-summary-actions">
    <button
      type="button"
      class="dao-summary-actions__refresh"
      [class.dao-summary-actions__refresh--loading]="loading()"
      (click)="onRefresh($event)"
      [attr.aria-busy]="loading()"
      aria-label="Actualiser les DAO"
    >
      <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
        <path d="M21 12a9 9 0 0 1-15.5 6.36" />
        <path d="M3 12a9 9 0 0 1 15.5-6.36" />
        <path d="M17 4v4h-4" />
        <path d="M7 20v-4h4" />
      </svg>
    </button>
  </div>
</div>
