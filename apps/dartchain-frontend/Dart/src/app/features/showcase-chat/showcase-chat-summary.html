<div
  class="showcase-chat-bar__fill"
  role="status"
  aria-live="polite"
  [attr.aria-label]="'Résumé du chat ' + roomLabel()"
>
  <div class="showcase-chat-main showcase-chat-main--preview">
    <span
      [class]="chatState.chatLedClass()"
      [attr.aria-label]="statusLabel()"
      [attr.title]="statusLabel()"
    ></span>

    @if (lastPreviewAuthor()) {
      <span class="showcase-chat-preview__author">{{ lastPreviewAuthor() }}:</span>
      <span class="showcase-chat-preview__text">{{ lastPreviewText() }}</span>
    } @else {
      <span class="showcase-chat-preview__text showcase-chat-preview__text--muted">
        {{ connected() ? 'Aucun message pour l’instant' : 'Connexion au salon…' }}
      </span>
    }

    @if (hasUnread()) {
      <span class="unread-badge" [attr.aria-label]="unreadCount() + ' non lus'">
        {{ unreadCount() > 99 ? '99+' : unreadCount() }}
      </span>
    }
  </div>

  <div class="showcase-chat-meta">
    <button
      type="button"
      class="showcase-chat-meta__refresh"
      [class.showcase-chat-meta__refresh--loading]="refreshing()"
      (click)="onRefresh($event)"
      [attr.aria-busy]="refreshing()"
      aria-label="Actualiser le chat"
    >
      <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
        <path d="M21 12a9 9 0 0 1-15.5 6.36" />
        <path d="M3 12a9 9 0 0 1 15.5-6.36" />
        <path d="M17 4v4h-4" />
        <path d="M7 20v-4h4" />
      </svg>
    </button>
  </div>
</div>
