@if (view(); as panel) {
  <aside
    class="star-quest-panel"
    [class.star-quest-panel--compact]="panel.compact"
    role="dialog"
    aria-modal="true"
    aria-labelledby="star-quest-panel-title"
    [appFocusTrap]="true"
    [attr.data-family]="panel.quest.family"
    [attr.data-claim]="panel.claimKind"
    [attr.data-live]="panel.live ? 'true' : null"
    [style.left.px]="panel.x"
    [style.top.px]="panel.y"
    [style.--sc-family-rgb]="panel.familyRgb"
    [style.--sc-family-hex]="panel.familyHex"
    (pointerdown)="$event.stopPropagation()"
    (click)="$event.stopPropagation()"
  >
    <header class="star-quest-panel__head">
      <div class="star-quest-panel__meta">
        <span class="star-quest-panel__badge star-quest-panel__badge--family">
          {{ panel.familyLabel }}
        </span>
        <span
          class="star-quest-panel__badge star-quest-panel__badge--status"
          [attr.data-status]="panel.quest.status"
        >
          {{ panel.statusLabel }}
        </span>
        @if (panel.live) {
          <span class="star-quest-panel__badge star-quest-panel__badge--live">Live</span>
        }
      </div>
      <button
        type="button"
        class="star-quest-panel__close"
        aria-label="Fermer la quest"
        (click)="dismiss(); $event.stopPropagation()"
        (pointerdown)="$event.stopPropagation()"
      >
        <span aria-hidden="true">×</span>
      </button>
    </header>

    <h2 id="star-quest-panel-title" class="star-quest-panel__title">{{ panel.quest.title }}</h2>
    <p class="star-quest-panel__desc">{{ panel.quest.description }}</p>

    <footer class="star-quest-panel__reward">
      <span class="star-quest-panel__reward-label">{{ panel.rewardLabel }}</span>
      <strong class="star-quest-panel__reward-value">{{ panel.rewardValue }}</strong>
    </footer>

    <button
      type="button"
      class="star-quest-panel__claim"
      [disabled]="!panel.ctaEnabled"
      [attr.aria-label]="panel.ctaLabel"
      (click)="onCta(); $event.stopPropagation()"
      (pointerdown)="$event.stopPropagation()"
    >
      {{ panel.ctaLabel }}
    </button>
    <p class="star-quest-panel__hint">{{ panel.hint }}</p>
    @if (claimErrorMessage(); as error) {
      <p class="star-quest-panel__error" role="alert">{{ error }}</p>
    }
  </aside>
}
