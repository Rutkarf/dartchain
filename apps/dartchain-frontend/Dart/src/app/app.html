<div class="app-shell" data-testid="app-shell">
  <a class="app-skip-link" href="#app-main-content">{{ locale.t('skip.main') }}</a>
  <!-- Fond organique statique (z-index 0, derrière WebGL) -->
  <div class="app-game-background" aria-hidden="true"></div>
  <app-particle-background class="app-background"></app-particle-background>
  <app-star-quest-panel />
  <app-star-quest-scanner />

  <app-navbar
    (exploreBlock)="openBlockDrawer($event)"
    (explorePending)="openPendingPanel()"
  >
    <app-bandeau-accueil></app-bandeau-accueil>
  </app-navbar>

  <main
    id="app-main-content"
    class="app-main-layout"
    [class.is-showcase-disabled]="!product.showcaseEnabled"
    [class.is-showcase-collapsed]="product.showcaseEnabled && showcaseCollapsed()"
    [class.is-chart-collapsed]="chartCollapsed()"
    [class.is-exchange-collapsed]="exchangeCollapsed()"
    [class.is-dock-collapsed]="dockCollapsed()"
    aria-label="Marché"
    tabindex="-1"
  >
    <app-swap></app-swap>

    <app-showcase-tab-showcase
      [activeTab]="activeShowcaseTab()"
      [showcaseCollapsed]="showcaseCollapsed()"
      [collapseAriaLabel]="showcaseCollapseLabel()"
      [refreshBusy]="showcaseRefreshBusy()"
      (tabChange)="onShowcaseTabChange($event)"
      (collapseToggle)="toggleShowcaseCollapsed()"
      (refresh)="refreshShowcasePanel($event)"
      (summaryExpand)="toggleShowcaseCollapsed()"
      (selectBlock)="openBlockFromShowcaseIndex($event)"
    />

    <app-dock-tabs-dock-tabs
      [activeTab]="activeBottomTab()"
      [dockCollapsed]="dockCollapsed()"
      [collapseAriaLabel]="dockCollapseLabel()"
      [refreshBusy]="dockRefreshBusy()"
      (tabChange)="onBottomTabChange($event)"
      (collapseToggle)="toggleDockCollapsed()"
      (refresh)="refreshDockPanel($event)"
      (summaryExpand)="toggleDockCollapsed()"
      (selectBlock)="openBlockDrawer($event)"
    />

    <app-graph
      [chartCollapsed]="chartCollapsed()"
      [collapseAriaLabel]="chartCollapseLabel()"
      (collapseToggle)="toggleChartCollapsed()"
      (summaryExpand)="toggleChartCollapsed()"
    />
  </main>

  <app-three-floor></app-three-floor>

  @if (r4v3SceneVisible()) {
    @defer (on idle) {
      <app-r4v3-scene class="app-r4v3-scene-layer" aria-hidden="true" />
    }
  }

  @if (shellBannerError(); as bannerError) {
    <div class="app-shell-error-banner">
      <app-error-banner [message]="bannerError" />
    </div>
  }

  <app-block-detail-drawer
    [open]="showDrawer()"
    [block]="selectedBlock()"
    (close)="closeBlockDrawer()"
  ></app-block-detail-drawer>

  <app-launch-form-drawer
    [open]="launchDrawer.isOpen()"
    [submitting]="launchDrawer.submitting()"
    [errorMessage]="launchDrawer.errorMessage()"
    (close)="launchDrawer.close()"
    (create)="launchDrawer.emitCreate($event)"
  />

  @if (questFeedback(); as feedback) {
    <div
      class="app-quest-feedback"
      [class.is-info]="feedback.kind === 'info'"
      [class.is-error]="feedback.kind === 'error'"
      role="status"
    >
      {{ feedback.message }}
    </div>
  }

  <app-auth-drawer />
</div>
