<section
  class="showcase-panel"
  [class.is-collapsed]="collapsed"
  [class.is-expanded]="!collapsed"
  [attr.data-active-tab]="activeTab"
>
  <div
    id="showcase-panel-body"
    class="showcase-panel__body"
    [class.showcase-panel__body--smart-collapsed]="collapsed"
    [attr.aria-hidden]="false"
  >
    <app-showcase-window
      [activeTab]="activeTab"
      [collapsed]="collapsed"
      (selectBlock)="onSelectBlock($event)"
    />
  </div>
</section>
