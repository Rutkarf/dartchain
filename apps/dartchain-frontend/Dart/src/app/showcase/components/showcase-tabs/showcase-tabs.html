<nav
 class="showcase-tabs"
 (pointerdown)="onTabPointerDown($event)"
 (dblclick)="onTabDoubleClick($event)"
>
  <app-depth-rail
    class="showcase-tabs__rail"
    preset="compact"
    mode="navigate"
    [loop]="false"
    [enabled]="false"
    [activeIndex]="tabIndex()"
    itemSelector=".showcase-tab"
    (indexChange)="onRailIndex($event)"
  >
  @for (tab of tabs; track tab.id) {
    <button
      type="button"
      role="tab"
      class="showcase-tab ds-surface ds-surface--showcase-tab"
      [attr.data-tab]="tab.id"
      [class.is-active]="isActive(tab.id)"
      [attr.aria-selected]="isActive(tab.id)"
      [attr.tabindex]="isActive(tab.id) ? '0' : '-1'"
      [attr.aria-controls]="'showcase-panel-' + tab.id"
      [attr.id]="'showcase-tab-' + tab.id"
      (click)="selectTab(tab.id)"
    >
      <span class="showcase-tab__label">{{ tab.label }}</span>
      @if (tab.id === 'tours' && unreadNewsCount() > 0) {
        <span
          class="showcase-tab__unread-toast"
          [class.showcase-tab__unread-toast--live]="newsToastLive()"
          aria-hidden="true"
        >
          <app-badge-digit-3d [text]="unreadBadgeLabel()" />
        </span>
      }
    </button>
  }
  </app-depth-rail>
</nav>
