<section
 class="app-bottom-stack"
 [class.is-dock-collapsed]="dockCollapsed"
>
  <div class="showcase-block__shell bottom-stack__shell ds-surface ds-surface--card">
    <header
 class="showcase-header showcase-header--tabs app-bottom-stack__header"
 >
      <div class="showcase-header-tabs">
        <nav
          class="showcase-tabs app-bottom-stack__tabs"
          role="tablist"
          (pointerdown)="onTabPointerDown($event)"
          (dblclick)="onTabDoubleClick($event)"
        >
          <button
            type="button"
            class="showcase-tab ds-surface ds-surface--showcase-tab"
            role="tab"
            data-dock-tab="chain"
            [attr.aria-selected]="activeTab === 'chain'"
            [class.is-active]="activeTab === 'chain'"
            (click)="selectDockTab('chain')"
          >
            <span class="showcase-tab__label">{{ locale.t('chain.title') }}</span>
          </button>
          @if (product.faucetEnabled) {
            <button
              type="button"
              class="showcase-tab ds-surface ds-surface--showcase-tab"
              role="tab"
              data-dock-tab="faucet"
              [attr.aria-selected]="activeTab === 'faucet'"
              [class.is-active]="activeTab === 'faucet'"
              (click)="selectDockTab('faucet')"
            >
              <span class="showcase-tab__label">{{ locale.t('dock.faucet') }}</span>
            </button>
          }
          <button
            type="button"
            class="showcase-tab showcase-tab--mempool ds-surface ds-surface--showcase-tab"
            role="tab"
            data-dock-tab="transactions"
            [attr.aria-selected]="activeTab === 'transactions'"
            [class.is-active]="activeTab === 'transactions'"
            (click)="selectDockTab('transactions')"
          >
            <span class="showcase-tab__label">{{ locale.t('dock.transactions') }}</span>
          </button>
          <button
            type="button"
            class="showcase-tab ds-surface ds-surface--showcase-tab"
            role="tab"
            data-dock-tab="peers"
            [attr.aria-selected]="activeTab === 'peers'"
            [class.is-active]="activeTab === 'peers'"
            (click)="selectDockTab('peers')"
          >
            <span class="showcase-tab__label">{{ locale.t('dock.peers') }}</span>
          </button>
          <button
            type="button"
            class="showcase-tab ds-surface ds-surface--showcase-tab"
            role="tab"
            data-dock-tab="quests"
            [attr.aria-selected]="activeTab === 'quests'"
            [class.is-active]="activeTab === 'quests'"
            (click)="selectDockTab('quests')"
          >
            <span class="showcase-tab__label">{{ locale.t('dock.quests') }}</span>
            @if (questsState.claimableCount() > 0) {
              <span
                class="showcase-tab__unread-toast"
                [class.showcase-tab__unread-toast--live]="questsState.phase() === 'urgent'"
                aria-hidden="true"
              >
                <app-badge-digit-3d [text]="claimableBadgeLabel()" />
              </span>
            }
          </button>
          <button
            type="button"
            class="showcase-tab ds-surface ds-surface--showcase-tab"
            role="tab"
            data-dock-tab="wallet"
            [attr.aria-selected]="activeTab === 'wallet'"
            [class.is-active]="activeTab === 'wallet'"
            (click)="selectDockTab('wallet')"
          >
            <span class="showcase-tab__label">{{ locale.t('dock.wallet') }}</span>
          </button>
        </nav>
      </div>
      <div class="showcase-header-actions">
        <app-collapsed-bar-actions
          [collapsed]="dockCollapsed"
          [collapseAriaLabel]="collapseAriaLabel"
          refreshAriaLabel="Actualiser le dock"
          [refreshBusy]="refreshBusy"
          (refresh)="refresh.emit($event)"
          (collapseToggle)="collapseToggle.emit()"
        />
      </div>
    </header>

    <div
      class="app-bottom-stack__content app-bottom-stack__band"
      [class.is-collapsed]="dockCollapsed"
      [class.is-smart-collapsed]="dockCollapsed"
      [class.is-summary-expandable]="dockCollapsed"
      [attr.data-active-tab]="activeTab"
      (click)="onContentClick($event)"
    >
      @if (dockCollapsed) {
        <div class="app-bottom-stack__summary">
          <app-dock-bottom-summary [activeTab]="activeTab" />
        </div>
      } @else {
        @switch (activeTab) {
          @case ('wallet') {
            <div class="app-bottom-stack__panel">
              <app-wallet-panel />
            </div>
          }
          @case ('faucet') {
            @if (product.faucetEnabled) {
              <div class="app-bottom-stack__panel app-bottom-stack__panel--faucet">
                <app-faucet />
              </div>
            }
          }
          @case ('transactions') {
            <div class="app-bottom-stack__panel app-bottom-stack__panel--transactions">
              <app-transactions-dock />
            </div>
          }
          @case ('chain') {
            <div class="app-bottom-stack__panel app-bottom-stack__panel--chain">
              <app-blocks-list (selectBlock)="selectBlock.emit($event)" />
            </div>
          }
          @case ('quests') {
            <div class="app-bottom-stack__panel app-bottom-stack__panel--quests">
              <app-quests-panel />
            </div>
          }
          @case ('peers') {
            <div class="app-bottom-stack__panel app-bottom-stack__panel--peers">
              <app-peer-panel />
            </div>
          }
          @case ('admin') {
            <div class="app-bottom-stack__panel app-bottom-stack__panel--admin">
              <app-admin-panel />
            </div>
          }
        }
      }
    </div>
  </div>
</section>
