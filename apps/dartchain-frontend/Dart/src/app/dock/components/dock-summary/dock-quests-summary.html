<div
  class="quests-summary-bar"
  role="status"
  aria-live="polite"
  [attr.aria-label]="barAriaLabel()"
>
  <span class="quests-summary-bar__mission" title="Network Guardian">
    Network Guardian
  </span>

  <span
    class="quests-summary-bar__quest"
    [class.is-empty]="!displayedQuestTitle()"
    [attr.title]="displayedQuestTitle()"
  >
    {{ displayedQuestTitle() }}
  </span>

  <div class="quests-summary-bar__actions">
    <button
      type="button"
      class="quests-summary-bar__claim"
      [disabled]="claimDisabled()"
      [class.is-ready]="canClaim()"
      (click)="onClaimQuest($event)"
      aria-label="Claim quest"
      title="Claim Quest"
    >
      CLAIM QUEST
    </button>
  </div>
</div>
