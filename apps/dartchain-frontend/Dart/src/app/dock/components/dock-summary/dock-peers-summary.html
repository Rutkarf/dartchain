<div
  class="peers-summary-bar"
  role="status"
  aria-live="polite"
  [attr.aria-label]="barAriaLabel()"
>
  <span class="peers-summary-bar__item" [attr.title]="'Peers ' + peerCount()">
    <span class="peers-summary-bar__label">Peers</span>
    <span class="peers-summary-bar__value">{{ peerCount() }}</span>
  </span>

  <span class="peers-summary-bar__sep" aria-hidden="true"></span>

  <span class="peers-summary-bar__item" title="Latence">
    <span class="peers-summary-bar__label">Latence</span>
    <span class="peers-summary-bar__value peers-summary-bar__value--latency">{{ latencyLabel() }}</span>
  </span>

  <span class="peers-summary-bar__sep" aria-hidden="true"></span>

  <span class="peers-summary-bar__item" title="Charge">
    <span class="peers-summary-bar__label">Charge</span>
    <span class="peers-summary-bar__value peers-summary-bar__value--load">{{ loadLabel() }}</span>
  </span>

  <span class="peers-summary-bar__sep" aria-hidden="true"></span>

  <span
    class="peers-summary-bar__item peers-summary-bar__item--peer"
    [class.is-empty]="!primaryPeerName()"
    [attr.title]="peerTitle()"
  >
    @if (primaryPeerName()) {
      <span class="peers-summary-bar__value peers-summary-bar__value--name">{{ primaryPeerName() }}</span>
      <span class="peers-summary-bar__value peers-summary-bar__value--people">{{ primaryPeerConnectedPeople() }}</span>
    } @else {
      <span class="peers-summary-bar__value peers-summary-bar__value--muted">{{ emptyPeerLabel() }}</span>
    }
  </span>
</div>
