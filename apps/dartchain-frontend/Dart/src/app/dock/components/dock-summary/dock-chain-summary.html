<div
  class="chain-summary-bar"
  role="status"
  aria-live="polite"
  [attr.aria-label]="barAriaLabel()"
>
  <div class="chain-summary-bar__status">
    <span
      class="dock-summary-status"
      [ngClass]="statusClass(phase())"
      [attr.aria-label]="'État : ' + statusLabel()"
    >
      {{ statusLabel() }}
    </span>
    @if (blockCount() > 0) {
      <span class="dock-summary-badge" [attr.aria-label]="blockCount() + ' blocs'">
        {{ blockCount() }}
      </span>
    }
  </div>

  <span
    class="chain-summary-bar__tip"
    [class.is-empty]="!tipHash()"
    [attr.title]="tipTitle()"
  >
    @if (tipHash()) {
      <span class="chain-summary-bar__tip-label">TIP</span>
      <span class="chain-summary-bar__tip-index">#{{ tipIndex() }}</span>
      <span class="chain-summary-bar__tip-hash">{{ tipHash() }}</span>
    } @else {
      <span class="chain-summary-bar__tip-hash">{{ emptyLabel() }}</span>
    }
  </span>

  <div class="chain-summary-bar__meta">
    @if (updatedAgeLabel()) {
      <span class="chain-summary-bar__time">{{ updatedAgeLabel() }}</span>
    }
  </div>

  <div class="chain-summary-bar__actions">
    <button
      type="button"
      class="chain-summary-bar__btn chain-summary-bar__btn--tip"
      (click)="onOpenTip($event)"
      [disabled]="!latestBlock()"
      aria-label="Ouvrir le bloc tip"
      title="Tip"
    >
      Tip
    </button>
    <button
      type="button"
      class="chain-summary-bar__btn chain-summary-bar__btn--copy"
      (click)="onCopyHash($event)"
      [disabled]="!tipHash()"
      [attr.aria-label]="copied() ? 'Hash copié' : 'Copier le hash du tip'"
      [attr.title]="copied() ? 'Copié' : 'Copy'"
    >
      {{ copied() ? 'OK' : 'Copy' }}
    </button>
  </div>
</div>
