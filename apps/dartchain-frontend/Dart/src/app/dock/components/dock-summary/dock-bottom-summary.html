<div class="dock-bottom-summary" [attr.data-active-tab]="activeTab">
  <!-- Tous les résumés montés au démarrage pour précharger les données. -->
  <div [hidden]="activeTab !== 'wallet'">
    <app-dock-wallet-summary />
  </div>
  @if (product.faucetEnabled) {
    <div [hidden]="activeTab !== 'faucet'">
      <app-dock-faucet-summary />
    </div>
  }
  <div [hidden]="activeTab !== 'transactions'">
    <app-dock-transactions-summary />
  </div>
  <div [hidden]="activeTab !== 'chain'">
    <app-dock-chain-summary />
  </div>
  <div [hidden]="activeTab !== 'quests'">
    <app-dock-quests-summary />
  </div>
  <div [hidden]="activeTab !== 'peers'">
    <app-dock-peers-summary />
  </div>
  <div [hidden]="activeTab !== 'admin'">
    <p class="dock-bottom-summary__fallback" role="status">Admin · seed lock</p>
  </div>
</div>
