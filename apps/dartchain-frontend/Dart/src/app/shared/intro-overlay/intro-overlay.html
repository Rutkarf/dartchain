<div
 class="intro"
 [class.intro--off]="!visible()"
 [class.intro--fonts]="fontsIn()"
 [class.intro--ready]="ready()"
 [class.intro--inserting]="inserting()"
 [class.intro--moon]="moonBoost()"
 [class.intro--launching]="launching()"
 [class.intro--recede]="receding()"
 [class.intro--to-header]="toHeader()"
 [class.intro--tour-handoff]="tourHandoff()"
 [class.intro--power]="powerOn()"
 [class.intro--exiting]="exiting()"
 [class.intro--coin-parked]="coinParked()"
 [class.intro--bridging]="handoff.flying()"
 [class.intro--bridge-go]="handoff.travelReady()"
 [class.intro--bridge-settle]="bridgeSettle()"
 [attr.role]="visible() ? 'dialog' : null"
 [attr.aria-modal]="visible() ? 'true' : null"
>
  <div class="intro__atmosphere" aria-hidden="true"></div>
  <div class="intro__grid" aria-hidden="true"></div>
  <canvas #gl class="intro__gl" aria-hidden="true"></canvas>
  <div class="intro__grain" aria-hidden="true"></div>
  <div class="intro__curtain" aria-hidden="true"></div>

  <div class="intro__hud">
    <div class="intro__brand-block">
      <a
 class="intro__site"
 href="https://dartchain.dev"
 target="_blank"
 rel="noopener noreferrer"
 >
        <span class="intro__site-kicker">Site applicatif</span>
        <span class="intro__site-bar">
          <svg class="intro__site-globe" viewBox="0 0 16 16" aria-hidden="true">
            <circle cx="8" cy="8" r="6.2" fill="none" stroke="currentColor" stroke-width="1.2" />
            <ellipse cx="8" cy="8" rx="2.6" ry="6.2" fill="none" stroke="currentColor" stroke-width="1.1" />
            <path d="M2 8h12M3.2 5.2h9.6M3.2 10.8h9.6" fill="none" stroke="currentColor" stroke-width="1" />
          </svg>
          <span class="intro__site-url">https://dartchain.dev</span>
          <span class="intro__site-go" aria-hidden="true">↗</span>
        </span>
      </a>
    </div>

    <div class="intro__launch">
      <div #coin class="intro__coin" aria-hidden="true"></div>
    </div>

    <div class="intro__insert">
      <button
 #hintPad
 type="button"
 class="intro__hint"
 [class.is-hover]="feedHover()"
 [attr.data-text]="ready() ? 'Feed The R4V3' : 'LOADING…'"
 [disabled]="!ready() || inserting() || moonBoost()"
 (pointerenter)="onFeedPointerEnter($event)"
 (pointerleave)="onFeedPointerLeave($event)"
 (pointerdown)="onFeedPointerDown($event)"
 (pointerup)="onFeedPointerUp($event)"
 (pointercancel)="onFeedPointerCancel($event)"
 (click)="startInsert($event)"
 >
        <span class="intro__hint-ring" aria-hidden="true"></span>
        <span class="intro__hint-scan" aria-hidden="true"></span>
        <span class="intro__hint-ghost intro__hint-ghost--cyan" aria-hidden="true">{{
          ready() ? 'Feed The R4V3' : 'LOADING…'
        }}</span>
        <span class="intro__hint-ghost intro__hint-ghost--mag" aria-hidden="true">{{
          ready() ? 'Feed The R4V3' : 'LOADING…'
        }}</span>
        <span class="intro__hint-stack">
          <span class="intro__hint-text">{{ ready() ? 'Feed The R4V3' : 'LOADING…' }}</span>
          @if (ready()) {
            <span class="intro__hint-sub">Cliquer&nbsp;&nbsp;pour&nbsp;&nbsp;entrer</span>
          }
        </span>
      </button>
    </div>

    <p class="intro__trustpilot">
      <svg class="intro__trustpilot-star" viewBox="0 0 24 24" aria-hidden="true">
        <path
          fill="#09814a"
          d="M12 1.8l2.9 6.7 7.2.6-5.5 4.7 1.7 7-6.3-3.8-6.3 3.8 1.7-7L1.9 9.1l7.2-.6L12 1.8z"
        />
      </svg>
      <span class="intro__trustpilot-word">Trustpilot</span>
    </p>
  </div>

  <div #traveler class="intro__traveler" aria-hidden="true"></div>
</div>
