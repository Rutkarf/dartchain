server:
  port: ${PORT:8080}

dartchain:
  persistence:
    mode: ${DARTCHAIN_PERSISTENCE_MODE:memory}
  product:
    commercial: false
    allow-legacy-private-key: false
    allow-server-wallet-create: false
    faucet-enabled: true
    showcase-enabled: true
    legacy-api-aliases-enabled: false
  chain:
    chain-id: 3377
    network-name: DartChain Native
    native-token: R4V3
    allow-server-evm-wallet-create: true
  auth:
    jwt-secret: ${DARTCHAIN_JWT_SECRET:dev-only-change-in-prod}
    access-token-ttl-seconds: 3600
    refresh-token-ttl-seconds: 604800
    legacy-session-enabled: false
    bootstrap-admin-username: ${DARTCHAIN_BOOTSTRAP_ADMIN:}
    password-min-length: 8
  oauth:
    dev-mock-enabled: ${OAUTH_DEV_MOCK_ENABLED:false}
    frontend-callback-url: ${OAUTH_FRONTEND_CALLBACK_URL:http://localhost:4200/}
    backend-base-url: ${OAUTH_BACKEND_BASE_URL:http://localhost:8080}
    google:
      enabled: ${OAUTH_GOOGLE_ENABLED:false}
      client-id: ${OAUTH_GOOGLE_CLIENT_ID:}
      client-secret: ${OAUTH_GOOGLE_CLIENT_SECRET:}
    meta:
      enabled: ${OAUTH_META_ENABLED:false}
      client-id: ${OAUTH_META_CLIENT_ID:}
      client-secret: ${OAUTH_META_CLIENT_SECRET:}
    apple:
      enabled: ${OAUTH_APPLE_ENABLED:false}
      client-id: ${OAUTH_APPLE_CLIENT_ID:}
      team-id: ${OAUTH_APPLE_TEAM_ID:}
      key-id: ${OAUTH_APPLE_KEY_ID:}
      private-key: ${OAUTH_APPLE_PRIVATE_KEY:}
    microsoft:
      enabled: ${OAUTH_MICROSOFT_ENABLED:false}
      client-id: ${OAUTH_MICROSOFT_CLIENT_ID:}
      client-secret: ${OAUTH_MICROSOFT_CLIENT_SECRET:}
    github:
      enabled: ${OAUTH_GITHUB_ENABLED:false}
      client-id: ${OAUTH_GITHUB_CLIENT_ID:}
      client-secret: ${OAUTH_GITHUB_CLIENT_SECRET:}
    x:
      enabled: ${OAUTH_X_ENABLED:false}
      client-id: ${OAUTH_X_CLIENT_ID:}
      client-secret: ${OAUTH_X_CLIENT_SECRET:}
    discord:
      enabled: ${OAUTH_DISCORD_ENABLED:false}
      client-id: ${OAUTH_DISCORD_CLIENT_ID:}
      client-secret: ${OAUTH_DISCORD_CLIENT_SECRET:}
  rate-limit:
    max-requests: 60
    window-ms: 60000
  security:
    strict-pending-signatures: true
  ops:
    restrict-actuator: false
    actuator-token: ${DARTCHAIN_ACTUATOR_TOKEN:}
    mempool-alert-threshold: ${DARTCHAIN_MEMPOOL_ALERT_THRESHOLD:50}
    http-error-alert-threshold: ${DARTCHAIN_HTTP_ERROR_ALERT_THRESHOLD:10}
    slow-request-threshold-ms: ${DARTCHAIN_SLOW_REQUEST_THRESHOLD_MS:2000}
    rbac-denied-alert-threshold: ${DARTCHAIN_RBAC_DENIED_ALERT_THRESHOLD:20}
  cors:
    allowed-origin-patterns:
      - http://localhost:*
      - http://127.0.0.1:*
      - https://localhost:*
      - https://127.0.0.1:*
      - https://dartchain.pages.dev
      - https://*.dartchain.pages.dev
      - https://*.pages.dev
      - https://dartzvz01-tagname.onrender.com
      - https://*.onrender.com
  data-import:
    enabled: false
    exit-after-import: true

management:
  endpoints:
    web:
      exposure:
        include: "health,info"
      access:
        default: unrestricted
    access:
      default: read_only
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when_authorized
      access: unrestricted
    info:
      access: unrestricted
  info:
    env:
      enabled: true

info:
  app:
    name: ${spring.application.name}
    version: 0.17.0-SNAPSHOT
    phase: AF
  dartchain:
    persistence-mode: ${dartchain.persistence.mode:memory}
    postgres-only-profiles: prod,staging

spring:
  application:
    name: dartchain-backend

blockchain:
  state:
    path: ${BLOCKCHAIN_STATE_PATH:data/blockchain-state.json}

exchange:
  ledger:
    path: ${EXCHANGE_LEDGER_PATH:data/exchange-ledger.json}

launch:
  projects:
    path: ${LAUNCH_PROJECTS_PATH:data/launch-projects.json}

chat:
  messages:
    path: ${CHAT_MESSAGES_PATH:data/chat-messages.json}

news:
  items:
    path: ${NEWS_ITEMS_PATH:data/news-items.json}

faq:
  questions:
    path: ${FAQ_QUESTIONS_PATH:data/faq-questions.json}

quests:
  progress:
    path: ${QUESTS_PROGRESS_PATH:data/quest-progress.json}

faucet:
  claims:
    path: ${FAUCET_CLAIMS_PATH:data/faucet-claims.json}

auth:
  users:
    path: ${AUTH_USERS_PATH:data/auth-users.json}
  session:
    ttl-seconds: ${AUTH_SESSION_TTL_SECONDS:604800}
