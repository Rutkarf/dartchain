# Cloudflare Pages — frontend Angular SPA (dartchain.pages.dev)
# Prod : build Git natif Pages (voir deploy/cloudflare.env.example).
# Upload manuel : npx wrangler pages deploy apps/dartchain-frontend/Dart/dist/browser --project-name=dartchain
#
# Ce fichier sert surtout à `wrangler pages deploy` (CI manual ou local).
# Ne pas utiliser `wrangler deploy` (Workers) pour ce projet.

name = "dartchain"
compatibility_date = "2025-07-16"
pages_build_output_dir = "apps/dartchain-frontend/Dart/dist/browser"
