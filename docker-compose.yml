# DartChain — fichier Docker Compose unique (profils)
#
# Stack par défaut (Postgres + backend + frontend) :
#   docker compose --profile default up --build
#
# Dev hybride (Postgres + backend, UI via ng serve) :
#   docker compose --profile dev up --build -d
#
# Staging :
#   docker compose --profile staging up --build
#
# Production HA (nginx + 2 backends) :
#   docker compose --profile prod up --build -d
#
# Multi-nœuds P2P :
#   docker compose --profile p2p up --build -d
#
# Postgres seul (mvnw local) :
#   docker compose --profile db-local up -d

x-backend-env-prod: &backend-env-prod
  PORT: 8080
  SPRING_PROFILES_ACTIVE: postgres,prod
  DARTCHAIN_PERSISTENCE_MODE: postgres
  DATABASE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-dartchain}
  DATABASE_USERNAME: ${POSTGRES_USER:-dartchain}
  DATABASE_PASSWORD: ${POSTGRES_PASSWORD:?Run npm run secrets:generate in apps/dartchain-backend}
  DARTCHAIN_ACTUATOR_TOKEN: ${DARTCHAIN_ACTUATOR_TOKEN:?Run npm run secrets:generate in apps/dartchain-backend}
  DARTCHAIN_JWT_SECRET: ${DARTCHAIN_JWT_SECRET:?Run npm run secrets:generate in apps/dartchain-backend}
  DARTCHAIN_CORS_EXTRA: ${DARTCHAIN_CORS_EXTRA:-}
  OAUTH_DEV_MOCK_ENABLED: "false"
  OAUTH_BACKEND_BASE_URL: ${OAUTH_BACKEND_BASE_URL:-}
  OAUTH_FRONTEND_CALLBACK_URL: ${OAUTH_FRONTEND_CALLBACK_URL:-}
  OAUTH_GOOGLE_ENABLED: ${OAUTH_GOOGLE_ENABLED:-false}
  OAUTH_GOOGLE_CLIENT_ID: ${OAUTH_GOOGLE_CLIENT_ID:-}
  OAUTH_GOOGLE_CLIENT_SECRET: ${OAUTH_GOOGLE_CLIENT_SECRET:-}
  OAUTH_META_ENABLED: ${OAUTH_META_ENABLED:-false}
  OAUTH_META_CLIENT_ID: ${OAUTH_META_CLIENT_ID:-}
  OAUTH_META_CLIENT_SECRET: ${OAUTH_META_CLIENT_SECRET:-}
  OAUTH_APPLE_ENABLED: ${OAUTH_APPLE_ENABLED:-false}
  OAUTH_APPLE_CLIENT_ID: ${OAUTH_APPLE_CLIENT_ID:-}
  OAUTH_APPLE_TEAM_ID: ${OAUTH_APPLE_TEAM_ID:-}
  OAUTH_APPLE_KEY_ID: ${OAUTH_APPLE_KEY_ID:-}
  OAUTH_APPLE_PRIVATE_KEY: ${OAUTH_APPLE_PRIVATE_KEY:-}
  OAUTH_MICROSOFT_ENABLED: ${OAUTH_MICROSOFT_ENABLED:-false}
  OAUTH_MICROSOFT_CLIENT_ID: ${OAUTH_MICROSOFT_CLIENT_ID:-}
  OAUTH_MICROSOFT_CLIENT_SECRET: ${OAUTH_MICROSOFT_CLIENT_SECRET:-}
  OAUTH_GITHUB_ENABLED: ${OAUTH_GITHUB_ENABLED:-false}
  OAUTH_GITHUB_CLIENT_ID: ${OAUTH_GITHUB_CLIENT_ID:-}
  OAUTH_GITHUB_CLIENT_SECRET: ${OAUTH_GITHUB_CLIENT_SECRET:-}
  OAUTH_X_ENABLED: ${OAUTH_X_ENABLED:-false}
  OAUTH_X_CLIENT_ID: ${OAUTH_X_CLIENT_ID:-}
  OAUTH_X_CLIENT_SECRET: ${OAUTH_X_CLIENT_SECRET:-}
  OAUTH_DISCORD_ENABLED: ${OAUTH_DISCORD_ENABLED:-false}
  OAUTH_DISCORD_CLIENT_ID: ${OAUTH_DISCORD_CLIENT_ID:-}
  OAUTH_DISCORD_CLIENT_SECRET: ${OAUTH_DISCORD_CLIENT_SECRET:-}
  JAVA_TOOL_OPTIONS: ${JAVA_TOOL_OPTIONS:--Xmx512m}

x-backend-healthcheck: &backend-healthcheck
  test: ["CMD-SHELL", "curl -fsS http://localhost:8080/actuator/health || curl -fsS http://localhost:8080/api/health || exit 1"]
  interval: 10s
  timeout: 5s
  retries: 12
  start_period: 45s

services:
  # ── Default ────────────────────────────────────────────────────────────────
  postgres:
    profiles: [default]
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-dartchain}
      POSTGRES_USER: ${POSTGRES_USER:-dartchain}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run npm run secrets:generate in apps/dartchain-backend}
    volumes:
      - dartchain_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-dartchain} -d ${POSTGRES_DB:-dartchain}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  backend:
    profiles: [default]
    build:
      context: ./apps/dartchain-backend
      dockerfile: Dockerfile
    environment:
      <<: *backend-env-prod
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck: *backend-healthcheck
    restart: unless-stopped

  frontend:
    profiles: [default]
    build:
      context: ./apps/dartchain-frontend/Dart
      dockerfile: Dockerfile
    ports:
      - "${APP_PORT:-8080}:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 6
      start_period: 15s
    restart: unless-stopped

  # ── Dev hybride ────────────────────────────────────────────────────────────
  postgres-dev:
    profiles: [dev]
    image: postgres:16-alpine
    ports:
      - "${POSTGRES_DEV_PORT:-5432}:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-dartchain}
      POSTGRES_USER: ${POSTGRES_USER:-dartchain}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dartchain}
    volumes:
      - dartchain_pg_dev_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-dartchain} -d ${POSTGRES_DB:-dartchain}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  backend-dev:
    profiles: [dev]
    build:
      context: ./apps/dartchain-backend
      dockerfile: Dockerfile
    ports:
      - "${BACKEND_DEV_PORT:-8080}:8080"
    environment:
      PORT: 8080
      SPRING_PROFILES_ACTIVE: postgres
      DARTCHAIN_PERSISTENCE_MODE: postgres
      DARTCHAIN_PRODUCT_COMMERCIAL: "false"
      DATABASE_URL: jdbc:postgresql://postgres-dev:5432/${POSTGRES_DB:-dartchain}
      DATABASE_USERNAME: ${POSTGRES_USER:-dartchain}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD:-dartchain}
      DARTCHAIN_JWT_SECRET: ${DARTCHAIN_JWT_SECRET:-dev-local-jwt-secret-for-cursor-development-only-32}
      DARTCHAIN_ACTUATOR_TOKEN: ${DARTCHAIN_ACTUATOR_TOKEN:-dev-local-actuator-token-for-development}
      DARTCHAIN_CORS_EXTRA: ${DARTCHAIN_CORS_EXTRA:-}
      OAUTH_DEV_MOCK_ENABLED: ${OAUTH_DEV_MOCK_ENABLED:-true}
      OAUTH_BACKEND_BASE_URL: ${OAUTH_BACKEND_BASE_URL:-http://localhost:8080}
      OAUTH_FRONTEND_CALLBACK_URL: ${OAUTH_FRONTEND_CALLBACK_URL:-http://localhost:4200/}
      OAUTH_GOOGLE_ENABLED: ${OAUTH_GOOGLE_ENABLED:-false}
      OAUTH_GOOGLE_CLIENT_ID: ${OAUTH_GOOGLE_CLIENT_ID:-}
      OAUTH_GOOGLE_CLIENT_SECRET: ${OAUTH_GOOGLE_CLIENT_SECRET:-}
      OAUTH_META_ENABLED: ${OAUTH_META_ENABLED:-false}
      OAUTH_META_CLIENT_ID: ${OAUTH_META_CLIENT_ID:-}
      OAUTH_META_CLIENT_SECRET: ${OAUTH_META_CLIENT_SECRET:-}
      OAUTH_APPLE_ENABLED: ${OAUTH_APPLE_ENABLED:-false}
      OAUTH_APPLE_CLIENT_ID: ${OAUTH_APPLE_CLIENT_ID:-}
      OAUTH_APPLE_TEAM_ID: ${OAUTH_APPLE_TEAM_ID:-}
      OAUTH_APPLE_KEY_ID: ${OAUTH_APPLE_KEY_ID:-}
      OAUTH_APPLE_PRIVATE_KEY: ${OAUTH_APPLE_PRIVATE_KEY:-}
      OAUTH_MICROSOFT_ENABLED: ${OAUTH_MICROSOFT_ENABLED:-false}
      OAUTH_MICROSOFT_CLIENT_ID: ${OAUTH_MICROSOFT_CLIENT_ID:-}
      OAUTH_MICROSOFT_CLIENT_SECRET: ${OAUTH_MICROSOFT_CLIENT_SECRET:-}
      OAUTH_GITHUB_ENABLED: ${OAUTH_GITHUB_ENABLED:-false}
      OAUTH_GITHUB_CLIENT_ID: ${OAUTH_GITHUB_CLIENT_ID:-}
      OAUTH_GITHUB_CLIENT_SECRET: ${OAUTH_GITHUB_CLIENT_SECRET:-}
      OAUTH_X_ENABLED: ${OAUTH_X_ENABLED:-false}
      OAUTH_X_CLIENT_ID: ${OAUTH_X_CLIENT_ID:-}
      OAUTH_X_CLIENT_SECRET: ${OAUTH_X_CLIENT_SECRET:-}
      OAUTH_DISCORD_ENABLED: ${OAUTH_DISCORD_ENABLED:-false}
      OAUTH_DISCORD_CLIENT_ID: ${OAUTH_DISCORD_CLIENT_ID:-}
      OAUTH_DISCORD_CLIENT_SECRET: ${OAUTH_DISCORD_CLIENT_SECRET:-}
      JAVA_TOOL_OPTIONS: ${JAVA_TOOL_OPTIONS:--Xmx512m}
    depends_on:
      postgres-dev:
        condition: service_healthy
    healthcheck: *backend-healthcheck
    restart: unless-stopped

  # ── Postgres seul (Spring Boot local) ──────────────────────────────────────
  postgres-local:
    profiles: [db-local]
    image: postgres:16-alpine
    ports:
      - "${POSTGRES_LOCAL_PORT:-5432}:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-dartchain}
      POSTGRES_USER: ${POSTGRES_USER:-dartchain}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dartchain}
    volumes:
      - dartchain_pg_local_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-dartchain} -d ${POSTGRES_DB:-dartchain}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ── Staging ────────────────────────────────────────────────────────────────
  postgres-staging:
    profiles: [staging]
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-dartchain_staging}
      POSTGRES_USER: ${POSTGRES_USER:-dartchain}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dartchain}
    ports:
      - "${POSTGRES_STAGING_PORT:-5433}:5432"
    volumes:
      - dartchain_staging_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-dartchain} -d ${POSTGRES_DB:-dartchain_staging}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  backend-staging:
    profiles: [staging]
    build:
      context: ./apps/dartchain-backend
      dockerfile: Dockerfile
    environment:
      PORT: 8080
      SPRING_PROFILES_ACTIVE: postgres,prod,staging
      DARTCHAIN_PERSISTENCE_MODE: postgres
      DATABASE_URL: jdbc:postgresql://postgres-staging:5432/${POSTGRES_DB:-dartchain_staging}
      DATABASE_USERNAME: ${POSTGRES_USER:-dartchain}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD:-dartchain}
      DARTCHAIN_ACTUATOR_TOKEN: ${DARTCHAIN_ACTUATOR_TOKEN:-}
      DARTCHAIN_CORS_EXTRA: ${DARTCHAIN_CORS_EXTRA:-}
      JAVA_TOOL_OPTIONS: ${JAVA_TOOL_OPTIONS:--Xmx512m}
    depends_on:
      postgres-staging:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 45s
    restart: unless-stopped

  frontend-staging:
    profiles: [staging]
    build:
      context: ./apps/dartchain-frontend/Dart
      dockerfile: Dockerfile
    ports:
      - "${APP_STAGING_PORT:-9080}:80"
    depends_on:
      backend-staging:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 6
      start_period: 15s
    restart: unless-stopped

  # ── Production HA + TLS ────────────────────────────────────────────────────
  postgres-prod:
    profiles: [prod]
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-dartchain}
      POSTGRES_USER: ${POSTGRES_USER:-dartchain}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run npm run secrets:generate in apps/dartchain-backend}
    volumes:
      - dartchain_pg_prod_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-dartchain} -d ${POSTGRES_DB:-dartchain}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  backend-a:
    profiles: [prod]
    build:
      context: ./apps/dartchain-backend
      dockerfile: Dockerfile
    environment:
      <<: *backend-env-prod
      DATABASE_URL: jdbc:postgresql://postgres-prod:5432/${POSTGRES_DB:-dartchain}
    depends_on:
      postgres-prod:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 45s
    restart: unless-stopped

  backend-b:
    profiles: [prod]
    build:
      context: ./apps/dartchain-backend
      dockerfile: Dockerfile
    environment:
      <<: *backend-env-prod
      DATABASE_URL: jdbc:postgresql://postgres-prod:5432/${POSTGRES_DB:-dartchain}
    depends_on:
      postgres-prod:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 45s
    restart: unless-stopped

  frontend-prod:
    profiles: [prod]
    build:
      context: ./apps/dartchain-frontend/Dart
      dockerfile: Dockerfile
    ports:
      - "${APP_PORT:-8080}:80"
    volumes:
      - ./infra/nginx/nginx.prod.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      backend-a:
        condition: service_healthy
      backend-b:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 6
      start_period: 15s
    restart: unless-stopped

  # ── P2P multi-nœuds ───────────────────────────────────────────────────────
  postgres-a:
    profiles: [p2p]
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB_A:-dartchain_a}
      POSTGRES_USER: ${POSTGRES_USER:-dartchain}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dartchain}
    volumes:
      - dartchain_pg_a:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-dartchain} -d ${POSTGRES_DB_A:-dartchain_a}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  postgres-b:
    profiles: [p2p]
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB_B:-dartchain_b}
      POSTGRES_USER: ${POSTGRES_USER:-dartchain}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dartchain}
    volumes:
      - dartchain_pg_b:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-dartchain} -d ${POSTGRES_DB_B:-dartchain_b}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  backend-p2p-a:
    profiles: [p2p]
    build:
      context: ./apps/dartchain-backend
      dockerfile: Dockerfile
    ports:
      - "${P2P_NODE_A_PORT:-8081}:8080"
    environment:
      PORT: 8080
      SPRING_PROFILES_ACTIVE: postgres,prod
      DARTCHAIN_PERSISTENCE_MODE: postgres
      DATABASE_URL: jdbc:postgresql://postgres-a:5432/${POSTGRES_DB_A:-dartchain_a}
      DATABASE_USERNAME: ${POSTGRES_USER:-dartchain}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD:-dartchain}
      JAVA_TOOL_OPTIONS: ${JAVA_TOOL_OPTIONS:--Xmx512m}
    depends_on:
      postgres-a:
        condition: service_healthy
    healthcheck: *backend-healthcheck
    restart: unless-stopped

  backend-p2p-b:
    profiles: [p2p]
    build:
      context: ./apps/dartchain-backend
      dockerfile: Dockerfile
    ports:
      - "${P2P_NODE_B_PORT:-8082}:8080"
    environment:
      PORT: 8080
      SPRING_PROFILES_ACTIVE: postgres,prod
      DARTCHAIN_PERSISTENCE_MODE: postgres
      DATABASE_URL: jdbc:postgresql://postgres-b:5432/${POSTGRES_DB_B:-dartchain_b}
      DATABASE_USERNAME: ${POSTGRES_USER:-dartchain}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD:-dartchain}
      JAVA_TOOL_OPTIONS: ${JAVA_TOOL_OPTIONS:--Xmx512m}
    depends_on:
      postgres-b:
        condition: service_healthy
    healthcheck: *backend-healthcheck
    restart: unless-stopped

volumes:
  dartchain_pg_data:
  dartchain_pg_dev_data:
  dartchain_pg_local_data:
  dartchain_staging_pg_data:
  dartchain_pg_prod_data:
  dartchain_pg_a:
  dartchain_pg_b:
